{
   "AllowAnonymousEndpointAccess": true,
   "AllowAnonymousStreamAccess": false,
   "AllowUnknownOptions": false,
   "CertificateFile": "/etc/kurrentdb/certs/node1/node.crt",
   "CertificatePrivateKeyFile": "/etc/kurrentdb/certs/node1/node.key",
   "TrustedRootCertificatesPath": "/etc/kurrentdb/certs/ca",
   "DisableClientAuthEkuValidation": true,
   "ClusterSecret": "i-enjoy-the-peace-and-quiet-of-network-partitions",
   "ClusterSize": 3,
   "Connectors": {
      "Enabled": false
   },
   "SecondaryIndexing": {
      "Enabled": false
   },
   "Db": "/var/lib/kurrentdb/db",
   "Index": "/var/lib/kurrentdb/index",
   "Log": "/var/log/kurrentdb",
   "DiscoverViaDns": false,
   "EnableAtomPubOverHttp": true,
   "GossipSeed": ["node2.eventstore:2113","node3.eventstore:2113"],
   "Insecure": false,
   "DisableTls": false,
   "IsDataPlaneNode": true,
   "IsKontrolPlaneNode": true,
   "KontrolPlaneApiSeed": ["node2.eventstore:2113","node3.eventstore:2113"],
   "KontrolPlaneBootstrapSeed": ["node2.eventstore:3113","node3.eventstore:3113"],
   "KontrolPlaneAppointmentTimeoutMs": 1000,
   "KontrolPlaneLowerElectionTimeoutMs": 700,
   "KontrolPlaneUpperElectionTimeoutMs": 1000,
   "KontrollerHostAdvertiseAs": "node1.eventstore",
   "KontrollerPort": 3113,
   "LogFailedAuthenticationAttempts": true,
   "NodeHostAdvertiseAs": "node1.eventstore",
   "NodeIp": "0.0.0.0",
   "NodePort": 2113,
   "NodePortAdvertiseAs": 2113,
   "ReadOnlyReplica": false,
   "ReplicationHostAdvertiseAs": "node1.eventstore",
   "ReplicationIp": "0.0.0.0",
   "ReplicationPort": 1112,
   "RunProjections": "None",
   "SkipDbVerify": true,
   "SkipIndexVerify": true
}
