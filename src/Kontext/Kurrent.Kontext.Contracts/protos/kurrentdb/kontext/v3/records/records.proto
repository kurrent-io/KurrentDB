edition = "2023";

package kurrentdb.kontext.v3.records;

option csharp_namespace = "Kurrent.Kontext.Contracts.Records";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service RecordsService {
  // TOOL — search — find LOG RECORDS by meaning (input: a natural-language `query`).
  // Not `recall` (that searches your own memories, which are claims you wrote).
  //
  // Search what the database actually recorded. Records are the events themselves — every JSON
  // payload the node has seen — so reach for this when you need the evidence rather than the
  // conclusion: what a stream actually contains, when something happened, which payload carried a
  // value, whether an event of some shape was ever written.
  //
  // Phrase `query` in natural language, describing the event you are looking for ("the order was
  // cancelled because the payment expired"), not keywords. Matching runs over a normalised,
  // flattened projection of the payload, so field names and values both count.
  //
  // NARROW WITH THE FILTERS WHEN YOU CAN, and `schema_name` first — "every OrderCancelled" is the
  // question people actually ask of a log. The index spans everything the node has seen, so an
  // unfiltered search ranks across all of it.
  //
  // Filtering is FREE and the page never comes back short: the engine evaluates the predicate while
  // it selects candidates, not after ranking, so a scoped search returns a full `limit` drawn from
  // the matching records — even when they are a handful among millions. There is no need to
  // oversample. Pick ONE per group: `stream` or `category` (a category IS a set of streams), and one
  // of `schema_name` / `schema_id` / `schema_format` (an id pins an exact version of a name, and a
  // name already implies its format).
  //
  // Only JSON records are indexed. A record with a non-JSON payload, or an empty one, was never
  // added and cannot be found here.
  //
  // Example: search { query: "a payment failed with an expired card", category: "order",
  //          limit: 10 }
  //
  // Returns: `hits`, ranked best-first — each carrying its `score` (higher = stronger; a low top
  // score means nothing matched well) and the full `Record`, payload included.
  //
  // Safety: READ-ONLY and side-effect-free. It touches no memory, writes nothing, and records no
  // access — unlike `recall`, which refreshes a recency clock.
  rpc Search(SearchRequest) returns (SearchResponse);

  // TOOL — query — read the log with SQL (input: a DuckDB `sql` statement).
  // Not `search` (that ranks by meaning) — this one filters, groups and counts EXACTLY.
  //
  // Reach for this when the question has a precise answer that ranking cannot give: how many, since
  // when, which streams, grouped by what. "How many OrderCancelled events last week", "every stream
  // in the payments category that has a Refund", "the 20 most recent records for this schema". Use
  // `search` when you are looking for something by meaning and cannot name the shape.
  //
  // ONE TABLE IS VISIBLE: `kdb.records`, every record the database holds. Naming anything else is
  // rejected, and so are table functions.
  //
  //   record_id       the record's id            log_position    its position in the global log
  //   stream          the stream it belongs to   stream_revision its revision within that stream
  //   category        the stream prefix          schema_name     the record type
  //   schema_id       the registered version     schema_format   the payload encoding
  //   created_at      epoch milliseconds         expires_at      epoch milliseconds, or null
  //   deleted         soft-delete flag           data            the payload
  //   metadata        the record metadata
  //
  // `data` holds the payload. JSON records carry their JSON verbatim, so DuckDB's JSON functions
  // apply directly: `json_extract_string(data, '$.orderId')`. A non-JSON payload arrives base64
  // encoded, which is why filtering on `schema_format = 'Json'` is usually what you want before
  // touching it.
  //
  // Example: query { sql: "SELECT stream, count(*) AS n FROM kdb.records
  //          WHERE schema_name = 'OrderCancelled' GROUP BY stream ORDER BY n DESC", limit: 20 }
  //
  // Returns: `rows`, each one object keyed by your SELECT's column names. Ask for the columns you
  // want — `SELECT *` pulls every payload in the result and fills your context with them.
  //
  // Safety: READ-ONLY. It cannot write, and the server rejects anything that is not a query.
  rpc Query(QueryRequest) returns (QueryResponse);
}

//===================================================================
// Search
//===================================================================

// Input for the `search` tool (see RecordsService.Search). Field comments are the parameter
// instructions the calling agent reads.
message SearchRequest {
  // Required. What you are looking for, in natural language — describe the event, not keywords.
  string query = 1;

  // How many records to return. Ask for a handful (say 5–10) — this is the page, and a filter never
  // costs you part of it.
  int32 limit = 2;

  // Optional. Drop anything the server scores below this cutoff — raise it when you only want
  // strong matches, leave it at 0 to see everything that ranked.
  double min_score = 3;

  // Optional. Where to look. A category IS the set of streams sharing its prefix, so naming both
  // would be either redundant or contradictory — pick the one you actually know.
  oneof scope {
    // A single stream, exactly as written ("order-8fc1a2").
    string stream = 4;

    // Every stream sharing this prefix — the text before the first '-' in the stream name
    // ("order" covers "order-8fc1a2" and "order-3b90ff").
    string category = 5;
  }

  // Optional. Which schema the record conforms to, at one of three widths. They are alternatives,
  // not a combination: an id pins an exact version of a name, and a name already implies its format.
  // `schema_name` is the one you usually want.
  oneof schema {
    // The record type ("OrderCancelled", "CustomerRegistered") — every version of it. This is the
    // sharpest filter the log has, and it is indexed.
    string schema_name = 8;

    // The exact registered schema version the record was written against.
    string schema_id = 6;

    // The coarse payload encoding, as the record carries it ("Json").
    string schema_format = 7;
  }
}

message SearchResponse {
  // Ranked best-first.
  repeated RecordHit hits = 1;

  // One search hit: the record and how strongly it matched.
  message RecordHit {
    // Blended relevance across the meaning and keyword legs; higher = stronger match. Your
    // weak-match signal: a low top score means nothing matched well. The breakdown is withheld.
    double score = 1;

    // The record as the index holds it.
    Record record = 2;
  }
}

//===================================================================
// Query
//===================================================================

// Input for the `query` tool (see RecordsService.Query). Field comments are the parameter
// instructions the calling agent reads.
message QueryRequest {
  // Required. A DuckDB SELECT over `kdb.records`. Anything that is not a query, and any other
  // table, is rejected before it runs.
  string sql = 1;

  // Max rows to return, capped by the server. Prefer aggregating in SQL over pulling rows back and
  // counting them yourself.
  int32 limit = 2;
}

message QueryResponse {
  // One object per row, keyed by the column names your SELECT produced.
  repeated google.protobuf.Struct rows = 1;

  // True when the row cap cut the result short — the answer is incomplete, so narrow the query.
  bool truncated = 2;
}

// A record the index holds, modelled on the streams API's AppendRecord — the same fields, under
// the same numbers, plus what only a STORED record has (its position in the log and when it
// landed). Two deliberate divergences from AppendRecord, both because this is the read side of
// an index rather than the write side of an append:
//   - `data` is text, not bytes. Only JSON records are indexed, so the payload is already a
//     string in the index and re-encoding it to bytes would buy nothing.
//   - `SchemaInfo.format` is a string, not the SchemaFormat enum. The indexer stores the format
//     as the name it read off the record.
message Record {
  // The record's unique identifier.
  string record_id = 1;

  // The properties the record carries — user-defined keys, and system keys prefixed with "$"
  // ("$correlationId", "$causationId", "$schemaId"). Present exactly as written.
  map<string, google.protobuf.Value> properties = 2;

  // Schema information for this record.
  SchemaInfo schema = 3;

  // The record payload, as written.
  string data = 4;

  // The stream the record belongs to.
  string stream = 5;

  // The record's position in the global log — a stable cursor, since the log only grows.
  int64 log_position = 6;

  // The set of streams this one belongs to: the text before the first '-' in `stream`.
  string category = 7;

  // When the record was written.
  google.protobuf.Timestamp created_at = 8;
}

// Schema information for a record — the read-side twin of the streams API's SchemaInfo.
message SchemaInfo {
  // Format of the record data, as the indexer read it off the record ("Json").
  string format = 1;

  // Schema name identifying the record type (e.g., "order-placed", "customer-registered").
  string name = 2;

  // Version identifier of the schema that the record conforms to. Empty when the record carried
  // no schema id header.
  string id = 3;
}
